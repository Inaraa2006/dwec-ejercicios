<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Solitario Manrique</title>

	<!--/*** !!!!!!!!!!!!!!!!!!! CODIGO !!!!!!!!!!!!!!!!!!!! ***/
	    Importar la hoja de estilos de Bootstrap 5 desde su CDN.
	    Debe ir ANTES de nuestra hoja de estilos para que, a igual
	    especificidad, se apliquen nuestros estilos y no los de Bootstrap.
	-->

	<link rel="stylesheet" href="css/solitario.css">
</head>

<body>
	<div class="central">

		<header class="cabecera">
			<h1 id="titulo">Solitario Manrique</h1>
			<!--/*** !!!!!!!!!!!!!!!!!!! CODIGO !!!!!!!!!!!!!!!!!!!! ***/
			    Insertar el logo (imagenes/logo.png) a la DERECHA del título,
			    con id="logo" y un texto alternativo adecuado.
			-->
		</header>

		<!-- Botones para elegir el modo de juego. El atributo data-modo indica
		     a JavaScript qué modo representa cada botón: NO lo cambien.
		     /*** !!!!!!!!!!!!!!!!!!! CODIGO !!!!!!!!!!!!!!!!!!!! ***/
		     Den a los botones aspecto de botón de Bootstrap (clases btn, btn-...).
		     Mantengan la clase btn-modo: JavaScript la usa para localizarlos. -->
		<nav class="modos" aria-label="Modos de juego">
			<span class="modos-titulo">Elige un modo:</span>
			<button type="button" class="btn-modo" data-modo="color">Escalera de color</button>
			<button type="button" class="btn-modo" data-modo="alterna">Escalera de color alternada</button>
			<button type="button" class="btn-modo" data-modo="palo">Mismo palo</button>
		</nav>

		<!-- Marcadores: modo actual, tiempo transcurrido y movimientos.
		     JavaScript escribe en los span internos. -->
		<h2 id="marcadores">
			<span>Modo: <span id="modo_actual">sin elegir</span></span>
			<span>Tiempo: <span id="contador_tiempo">00:00:00</span></span>
			<span>Movimientos: <span id="contador_movimientos">0</span></span>
		</h2>

		<!-- La mesa contiene los 6 tapetes: arriba el inicial y el de sobrantes,
		     abajo los cuatro receptores. Cada tapete tiene su contador (span). -->
		<div id="mesa">
			<div class="tapetes_superiores">
				<div id="inicial" class="tapete">
					<span id="contador_inicial" class="contador">0</span>
					<p id="aviso" class="aviso">Elige un modo de juego para empezar</p>
				</div>
				<div id="sobrantes" class="tapete">
					<span id="contador_sobrantes" class="contador">0</span>
				</div>
			</div>
			<div class="tapetes_receptores">
				<div id="receptor1" class="tapete receptor">
					<span id="contador_receptor1" class="contador">0</span>
				</div>
				<div id="receptor2" class="tapete receptor">
					<span id="contador_receptor2" class="contador">0</span>
				</div>
				<div id="receptor3" class="tapete receptor">
					<span id="contador_receptor3" class="contador">0</span>
				</div>
				<div id="receptor4" class="tapete receptor">
					<span id="contador_receptor4" class="contador">0</span>
				</div>
			</div>
		</div>

		<!-- Botones de control de la partida.
		     Reiniciar y Finalizar empiezan desactivados (disabled) porque
		     al cargar la página todavía no hay ninguna partida.
		     /*** !!!!!!!!!!!!!!!!!!! CODIGO !!!!!!!!!!!!!!!!!!!! ***/
		     Denles aspecto de botón de Bootstrap. -->
		<div class="controles">
			<button type="button" id="reset" disabled>Reiniciar</button>
			<button type="button" id="nuevo">Nuevo juego</button>
			<button type="button" id="finalizar" disabled>Finalizar partida</button>
		</div>

	</div>

	<!-- Ventana con el resumen de la partida (elemento <dialog> de HTML).
	     Se abre desde JavaScript con dialogo.showModal() y se cierra con
	     dialogo.close(). -->
	<dialog id="dialogo_fin" class="dialogo">
		<h3>Fin de la partida</h3>
		<p id="resumen_fin"></p>
		<button type="button" id="cerrar_dialogo">Aceptar</button>
	</dialog>

	<!--/*** !!!!!!!!!!!!!!!!!!! CODIGO !!!!!!!!!!!!!!!!!!!! ***/
	    Importar el fichero JavaScript de Bootstrap 5 desde su CDN.
	-->

	<!-- Nuestro programa va al final del body: así, cuando se ejecuta,
	     todos los elementos de la página ya existen. -->
	<script src="js/solitario.js"></script>
</body>
</html>
